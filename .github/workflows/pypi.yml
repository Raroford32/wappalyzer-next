name: publish pypi package when a tag is created

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install package and test dependencies
      run: python3 -m pip install --upgrade --editable . pytest pytest-cov ruff
    - name: Verify tag matches package version
      run: test "v$(python3 -c 'import wappalyzer; print(wappalyzer.__version__)')" = "$GITHUB_REF_NAME"
    - name: Install Chromium
      run: python3 -m playwright install --with-deps chromium
    - name: Run static checks
      run: |
        ruff check .
        ruff format --check .
    - name: Run complete test suite
      run: timeout 180 pytest --cov --cov-fail-under=70
      env:
        RUN_BROWSER_TESTS: "1"

  build:
    name: Build distribution 📦
    needs:
    - verify
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wappalyzer
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
