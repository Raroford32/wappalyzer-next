name: quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade --editable . pytest pytest-cov
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: python-coverage
          path: coverage.xml

  coverage-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade --editable . coverage pytest
      - name: Enforce complete orchestration statement and branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest \
            tests/test_models.py \
            tests/test_evidence.py \
            tests/test_evidence_limits.py \
            tests/test_targets.py \
            tests/test_resources.py \
            tests/test_runstore.py \
            tests/test_runstore_integrity.py \
            tests/test_stream_output.py \
            tests/test_output_durability.py \
            tests/test_transport.py \
            tests/test_direct_requester.py \
            tests/test_discovery.py \
            tests/test_regex_workers.py \
            tests/test_engine.py \
            tests/test_direct.py \
            tests/test_pipeline.py \
            tests/test_cli.py
          python -m coverage report --fail-under=100 --no-skip-covered -m \
            wappalyzer/__main__.py \
            wappalyzer/core/direct_requester.py \
            wappalyzer/core/regex_workers.py \
            wappalyzer/core/transport.py \
            wappalyzer/direct.py \
            wappalyzer/discovery.py \
            wappalyzer/engine.py \
            wappalyzer/evidence.py \
            wappalyzer/evidence_limits.py \
            wappalyzer/models.py \
            wappalyzer/output.py \
            wappalyzer/pipeline.py \
            wappalyzer/resources.py \
            wappalyzer/runstore.py \
            wappalyzer/targets.py
      - name: Verify data, channel, schema, and update matrices
        run: >-
          pytest
          tests/test_channel_matrix.py
          tests/test_data_integrity.py
          tests/test_schema.py
          tests/test_update.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade --editable . pytest
      - run: python -m playwright install --with-deps chromium
      - run: timeout 120 pytest tests/test_browser_integration.py
        env:
          RUN_BROWSER_TESTS: "1"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .audit-venv
      - run: .audit-venv/bin/python -m pip install --upgrade pip setuptools wheel
      - run: .audit-venv/bin/python -m pip install . pip-audit
      - run: .audit-venv/bin/pip-audit

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade --editable .
      - run: python benchmarks/throughput.py --mode fast --repeats 2
      - name: Verify bounded pipeline scaling, parity, and recovery
        run: >-
          python benchmarks/pipeline.py
          --records 200
          --workers 1 4
          --service-delay-ms 0.25
          --interrupt-after 25
      - name: Verify all-channel hybrid scaling and parity
        run: python benchmarks/complete_scan.py --repeats 200 --workers 1 4

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag wappalyzer-next:test .
      - run: docker run --rm wappalyzer-next:test --help
