[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["wappalyzer"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["wappalyzer/data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
